name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test --if-present

      - name: Build Application
        id: build_step
        run: |
          echo "Running build: npm run build --if-present"
          npm run build --if-present || true
          echo "=== Top-level directory listing ==="
          ls -la
          echo "=== Check for common build folders ==="
          for d in dist build out lib public; do
            if [ -d "$d" ]; then
              echo "Found build folder: $d"
            fi
          done

      # a quick step to detect artifact folders and set output
      - name: Detect build artifact
        id: detect_artifact
        run: |
          FOUND=false
          for d in dist build out lib public; do
            if [ -d "$d" ]; then
              FOUND=true
              echo "::set-output name=folder::$d"
              break
            fi
          done
          if [ "$FOUND" = "true" ]; then
            echo "found=true" > found.txt
            echo "::set-output name=found::true"
          else
            echo "found=false" > found.txt
            echo "::set-output name=found::false"
          fi
        # Note: set-output is used here — GitHub supports it but if your runner enforces the newer environment-files approach,
        # you can adapt to write to GITHUB_OUTPUT instead.

      - name: Upload Build Artifact (only if found)
        if: steps.detect_artifact.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            ${{ steps.detect_artifact.outputs.folder }}

      # Build Docker image (adjust path if you have different Dockerfile)
      - name: Build Docker Image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t kiu-opsnova-app .
          elif [ -f docker/Dockerfile.dev ]; then
            docker build -f docker/Dockerfile.dev -t kiu-opsnova-app .
          else
            echo "No Dockerfile found in root or docker/Dockerfile.dev" && exit 1
          fi

