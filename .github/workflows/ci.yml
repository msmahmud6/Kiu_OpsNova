name: CI/CD Pipeline (Build → E2E → Push → Deploy)

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  # change if you want a different image name
  IMAGE_NAME: ${{ secrets.IMAGE_NAME || format('ghcr.io/{0}/kiu-opsnova-app', github.repository_owner) }}
  APP_PORT: 3000
  APP_HEALTH_URL: http://localhost:3000/ # adjust if your app serves elsewhere

jobs:
  build-and-test:
    name: Build, Unit Tests & E2E
    runs-on: ubuntu-latest
    services:
      # optional: add a test DB here if you need (postgres, redis, etc.)
      # postgres:
      #   image: postgres:15
      #   env:
      #     POSTGRES_USER: test
      #     POSTGRES_PASSWORD: test
      #     POSTGRES_DB: testdb
      #   ports: ['5432:5432']
      #   options: >-
      #     --health-cmd "pg_isready -U test"
      #     --health-interval 10s
      #     --health-timeout 5s
      #     --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (if present)
        run: npm run lint --if-present

      - name: Run unit tests (if present)
        run: npm test --if-present

      - name: Build application (if present)
        run: npm run build --if-present

      # Build Docker image (local) for E2E
      - name: Build Docker Image for E2E
        run: |
          # build using repo dockerfile if exists, else docker/Dockerfile.dev
          if [ -f Dockerfile ]; then
            docker build -t $IMAGE_NAME:ci-temp .
          elif [ -f docker/Dockerfile.dev ]; then
            docker build -f docker/Dockerfile.dev -t $IMAGE_NAME:ci-temp .
          else
            echo "No Dockerfile found in root or docker/Dockerfile.dev" && exit 1
          fi

      - name: Run container for E2E
        run: |
          # stop any existing temp container
          docker rm -f ci-temp-container || true
          docker run -d --name ci-temp-container -p ${APP_PORT}:${APP_PORT} $IMAGE_NAME:ci-temp
          # wait for app to be ready using wait-on (install quickly)
          npm i -g wait-on
          echo "Waiting for ${APP_HEALTH_URL} (timeout 60s)..."
          wait-on --timeout 60000 ${APP_HEALTH_URL}

      - name: Run E2E tests (if present)
        run: |
          # run project's e2e script if available; otherwise fallback to common frameworks
          if npm run | grep -q e2e; then
            npm run e2e --if-present
          elif [ -f cypress.json ] || [ -d cypress ]; then
            npx cypress run
          elif [ -d tests/e2e ] || [ -f playwright.config.ts ] || [ -f playwright.config.js ]; then
            npx playwright test
          else
            echo "No e2e test script or config found — skipping E2E."
          fi
        # do not fail the whole job if e2e doesn't exist; but if it exists and fails -> job fails

      - name: Stop E2E container
        if: always()
        run: docker rm -f ci-temp-container || true

      - name: Upload build artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist
            build

  push-and-deploy:
    name: Push Image & Deploy to Brilliant Cloud
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Build and tag image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t $IMAGE_NAME:latest .
          elif [ -f docker/Dockerfile.dev ]; then
            docker build -f docker/Dockerfile.dev -t $IMAGE_NAME:latest .
          else
            echo "No Dockerfile found" && exit 1
          fi

      - name: Push image to registry
        run: docker push $IMAGE_NAME:latest

      - name: Deploy to Brilliant Cloud via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.BRILLIANT_HOST }}
          username: ${{ secrets.BRILLIANT_USER }}
          port: ${{ secrets.BRILLIANT_SSH_PORT || '22' }}
          key: ${{ secrets.BRILLIANT_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Pulling image $IMAGE_NAME:latest"
            docker pull $IMAGE_NAME:latest
            # stop & remove existing container (if named kiu-opsnova)
            docker stop kiu-opsnova || true
            docker rm kiu-opsnova || true
            # run new container (adjust env / volume / ports as needed)
            docker run -d --name kiu-opsnova -p ${APP_PORT}:${APP_PORT} \
              --restart unless-stopped \
              $IMAGE_NAME:latest
            echo "Deployment finished."


